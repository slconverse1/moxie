<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<style>
:root{--bg:#fbfcfb;--ink:#15221f;--muted:#5b6b67;--line:#d5dddb;--accent:#0b6b5c;--code:#eef3f1;--link:blue;}
@media (prefers-color-scheme:dark){:root{--bg:#0e1816;--ink:#e3efec;--muted:#93a8a2;--line:#27403a;--accent:#4cc9ad;--code:#15221f;--link:#7db7ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
nav{border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:15px}
nav a{color:var(--accent);text-decoration:none;font-weight:600}
nav a:hover{text-decoration:underline}
nav .brand{margin-right:0}
blockquote{border:1px solid var(--accent);border-radius:8px;padding:8px 14px;margin:14px 0;background:var(--code)}
blockquote p{margin:0}
main{max-width:50rem;margin:0 auto;padding:8px 16px 64px}
h1,h2,h3{line-height:1.25}
a{color:var(--link)}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
code{background:var(--code);padding:.1em .3em;border-radius:4px}
pre{background:var(--code);padding:12px 14px;border-radius:8px;overflow-x:auto;line-height:1.45}
pre code{background:none;padding:0}
table{border-collapse:collapse;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
</style>
</head>
<body>
<nav>
  {% assign gc = false %}{% assign base = '' %}{% if page.dialect == 'gc' %}{% assign gc = true %}{% assign base = '/gc' %}{% endif %}
  <a class="brand" href="{{ base | append: '/' | relative_url }}">{% if gc %}moxie/gc{% else %}moxie{% endif %}</a>
  <a href="{{ base | append: '/tutorial.html' | relative_url }}">Tutorial</a>
  <a href="{{ base | append: '/guide.html' | relative_url }}">Mixer's Guide</a>
  <a href="{{ base | append: '/spec.html' | relative_url }}">Spec</a>
  <a href="{{ base | append: '/style.html' | relative_url }}">Style</a>
  <a href="{{ '/colonless.html' | relative_url }}">Syntax</a>
  {% if gc %}<a href="{{ '/gc/try.html' | relative_url }}">Try moxie/gc</a>{% else %}<a href="{{ '/try.html' | relative_url }}">Try moxie</a>{% endif %}
  <a href="{{ base | append: '/repl.html' | relative_url }}">REPL</a>
  <a href="https://github.com/slconverse1/moxie">Source</a>
</nav>
<main>
{{ content }}
</main>
</body>
</html>
